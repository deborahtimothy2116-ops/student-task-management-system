version: "3.8"

services:
  edutask-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edutask_app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - PORT=8000
      - REDIS_URL=redis://redis-cache:6379/0
    restart: unless-stopped
    depends_on:
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - edutask-net

  redis-cache:
    image: redis:7-alpine
    container_name: edutask_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - edutask-net

networks:
  edutask-net:
    driver: bridge

volumes:
  redis-data:
